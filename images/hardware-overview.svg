<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
<defs>
<style>
.title { font: 700 40px Arial, sans-serif; fill: #0f172a; }
.subtitle { font: 600 19px Arial, sans-serif; fill: #475569; }
.h2 { font: 700 24px Arial, sans-serif; fill: #0f172a; }
.body { font: 16px Arial, sans-serif; fill: #0f172a; }
.small { font: 14px Arial, sans-serif; fill: #475569; }
.tiny { font: 13px Arial, sans-serif; fill: #475569; }
.label { font: 700 16px Arial, sans-serif; fill: #0f172a; }
</style>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="50" y="65" class="title">Benötigte Hardware – Home Assistant RFID RC522 Terminal</text><text x="50" y="100" class="subtitle">Übersicht der Bauteile für den kompletten Nachbau</text><rect x="50" y="150" width="825" height="210" rx="22" fill="#e0f2fe" stroke="#cbd5e1" stroke-width="2"/><circle cx="138" cy="255" r="54" fill="white" stroke="#cbd5e1" stroke-width="2"/><rect x="104" y="228" width="68" height="48" rx="8" fill="#94a3b8" stroke="#64748b" stroke-width="2"/><rect x="112" y="236" width="52" height="32" rx="4" fill="#e2e8f0"/><circle cx="138" cy="281" r="3" fill="#64748b"/><text x="215" y="205" class="h2">ESP32-C3 DevKitM-1</text><text x="215" y="248" class="body">Steuereinheit für ESPHome, WLAN und die gesamte Logik.</text><text x="215" y="280" class="small">An dieses Board werden RC522, Buzzer und LED angeschlossen.</text><rect x="215" y="302" width="520" height="26" rx="9" fill="white" stroke="#cbd5e1"/><text x="233" y="321" class="tiny">Pflicht-Komponente</text><rect x="925" y="150" width="825" height="210" rx="22" fill="#dbeafe" stroke="#cbd5e1" stroke-width="2"/><circle cx="1013" cy="255" r="54" fill="white" stroke="#cbd5e1" stroke-width="2"/><rect x="978" y="215" width="70" height="78" rx="10" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/><path d="M 1003 237 a20 20 0 0 0 0 36" fill="none" stroke="white" stroke-width="2.5"/><path d="M 1023 237 a20 20 0 0 1 0 36" fill="none" stroke="white" stroke-width="2.5"/><text x="1090" y="205" class="h2">RC522 RFID Modul</text><text x="1090" y="248" class="body">Liest RFID-Karten, Tags oder Schlüsselanhänger.</text><text x="1090" y="280" class="small">Anschluss über SPI: SDA/SS, SCK, MOSI, MISO, RST.</text><rect x="1090" y="302" width="520" height="26" rx="9" fill="white" stroke="#cbd5e1"/><text x="1108" y="321" class="tiny">SPI-Kommunikation</text><rect x="50" y="395" width="825" height="210" rx="22" fill="#ecfccb" stroke="#cbd5e1" stroke-width="2"/><circle cx="138" cy="500" r="54" fill="white" stroke="#cbd5e1" stroke-width="2"/><circle cx="138" cy="500" r="30" fill="#111827"/><circle cx="138" cy="500" r="5" fill="#f8fafc"/><text x="215" y="450" class="h2">Passiver Piezo-Buzzer</text><text x="215" y="493" class="body">Für OK-, Fehler- und Alarmtöne per RTTTL.</text><text x="215" y="525" class="small">Wichtig: passiv, damit Tonfolgen korrekt funktionieren.</text><rect x="215" y="547" width="520" height="26" rx="9" fill="white" stroke="#cbd5e1"/><text x="233" y="566" class="tiny">RTTTL-Audio</text><rect x="925" y="395" width="825" height="210" rx="22" fill="#fae8ff" stroke="#cbd5e1" stroke-width="2"/><circle cx="1013" cy="500" r="54" fill="white" stroke="#cbd5e1" stroke-width="2"/><circle cx="1007" cy="489" r="18" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/><line x1="1007" y1="507" x2="1007" y2="535" stroke="#111827" stroke-width="3"/><line x1="1018" y1="507" x2="1018" y2="535" stroke="#111827" stroke-width="2"/><polyline points="973,525 983,515 993,535 1003,515 1013,535 1023,515 1033,525" fill="none" stroke="#a16207" stroke-width="3"/><text x="1090" y="450" class="h2">LED + 220 Ω Widerstand</text><text x="1090" y="493" class="body">Optionale optische Statusanzeige für Scan und Feedback.</text><text x="1090" y="525" class="small">GPIO2 → 220 Ω → LED-Anode, LED-Kathode → GND.</text><rect x="1090" y="547" width="520" height="26" rx="9" fill="white" stroke="#cbd5e1"/><text x="1108" y="566" class="tiny">Optisches Feedback</text><rect x="50" y="640" width="825" height="210" rx="22" fill="#fff7ed" stroke="#cbd5e1" stroke-width="2"/><circle cx="138" cy="745" r="54" fill="white" stroke="#cbd5e1" stroke-width="2"/><line x1="122" y1="710" x2="122" y2="780" stroke="#475569" stroke-width="4"/><line x1="132" y1="710" x2="132" y2="780" stroke="#475569" stroke-width="4"/><line x1="142" y1="710" x2="142" y2="780" stroke="#475569" stroke-width="4"/><line x1="152" y1="710" x2="152" y2="780" stroke="#475569" stroke-width="4"/><circle cx="142" cy="785" r="4" fill="#475569"/><text x="215" y="695" class="h2">Jumper-Kabel</text><text x="215" y="738" class="body">Für die Verdrahtung zwischen allen Modulen.</text><text x="215" y="770" class="small">Je nach Board/Modul meist Female–Female oder passend kombiniert.</text><rect x="215" y="792" width="520" height="26" rx="9" fill="white" stroke="#cbd5e1"/><text x="233" y="811" class="tiny">Verdrahtung</text><rect x="925" y="640" width="825" height="210" rx="22" fill="#fef3c7" stroke="#cbd5e1" stroke-width="2"/><circle cx="1013" cy="745" r="54" fill="white" stroke="#cbd5e1" stroke-width="2"/><rect x="983" y="714" width="50" height="40" rx="6" fill="white" stroke="#94a3b8" stroke-width="2"/><circle cx="1041" cy="758" r="10" fill="none" stroke="#64748b" stroke-width="3"/><text x="1090" y="695" class="h2">RFID Tag / Karte</text><text x="1090" y="738" class="body">Zum Testen und für spätere Automationen in Home Assistant.</text><text x="1090" y="770" class="small">Kann als Chip, Karte oder Schlüsselanhänger vorliegen.</text><rect x="1090" y="792" width="520" height="26" rx="9" fill="white" stroke="#cbd5e1"/><text x="1108" y="811" class="tiny">RFID-Identifikation</text><rect x="50" y="885" width="825" height="210" rx="22" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><circle cx="138" cy="990" r="54" fill="white" stroke="#cbd5e1" stroke-width="2"/><rect x="110" y="957" width="54" height="66" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><line x1="126" y1="957" x2="126" y2="943" stroke="#94a3b8" stroke-width="4"/><line x1="148" y1="957" x2="148" y2="943" stroke="#94a3b8" stroke-width="4"/><text x="215" y="940" class="h2">USB-Kabel + 5 V Versorgung</text><text x="215" y="983" class="body">Zum Flashen und für die Stromversorgung des ESP32-C3.</text><text x="215" y="1015" class="small">Bei vielen Boards wird USB-C verwendet.</text><rect x="215" y="1037" width="520" height="26" rx="9" fill="white" stroke="#cbd5e1"/><text x="233" y="1056" class="tiny">Strom + Flashen</text><rect x="925" y="885" width="825" height="210" rx="22" fill="#dcfce7" stroke="#cbd5e1" stroke-width="2"/><circle cx="1013" cy="990" r="54" fill="white" stroke="#cbd5e1" stroke-width="2"/><circle cx="1001" cy="977" r="11" fill="#2563eb"/><circle cx="1025" cy="977" r="11" fill="#16a34a"/><circle cx="1013" cy="1003" r="11" fill="#f59e0b"/><text x="1090" y="940" class="h2">Home Assistant + ESPHome + HACS</text><text x="1090" y="983" class="body">Software-Seite des Projekts.</text><text x="1090" y="1015" class="small">Button Card ist empfohlen, card-mod optional.</text><rect x="1090" y="1037" width="520" height="26" rx="9" fill="white" stroke="#cbd5e1"/><text x="1108" y="1056" class="tiny">Software / Dashboard</text><rect x="50" y="1125" width="1700" height="42" rx="14" fill="#eff6ff" stroke="#bfdbfe"/><text x="72" y="1152" class="body">Empfohlene Reihenfolge: Hardware aufbauen → ESPHome flashen → Home Assistant verbinden → Dashboard einfügen → RFID-Tags testen</text></svg>