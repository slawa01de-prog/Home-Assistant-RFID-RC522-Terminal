<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 600 18px Arial, sans-serif; fill: #475569; }
      .h2 { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .body { font: 15px Arial, sans-serif; fill: #0f172a; }
      .small { font: 13px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="white"/>
  <text x="50" y="60" class="title">Benötigte Hardware – Home Assistant RFID RC522 Terminal</text>
  <text x="50" y="95" class="subtitle">Übersicht der Komponenten für den Nachbau</text>

  <rect x="50" y="140" width="720" height="150" rx="18" fill="#e0f2fe" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="115" cy="215" r="40" fill="white" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="90" y="195" width="50" height="40" rx="6" fill="#94a3b8" stroke="#64748b"/>
  <rect x="98" y="203" width="34" height="24" fill="#e2e8f0"/>
  <text x="175" y="185" class="h2">ESP32-C3 DevKitM-1</text>
  <text x="175" y="218" class="body">Zentrale Steuereinheit für ESPHome, WLAN und Logik.</text>
  <text x="175" y="246" class="small">Verbindet RC522, Buzzer und LED mit Home Assistant.</text>

  <rect x="830" y="140" width="720" height="150" rx="18" fill="#dbeafe" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="895" cy="215" r="40" fill="white" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="867" y="188" width="56" height="54" rx="8" fill="#2563eb" stroke="#1d4ed8"/>
  <path d="M885 205 a16 16 0 0 0 0 30" fill="none" stroke="white" stroke-width="2"/>
  <path d="M905 205 a16 16 0 0 1 0 30" fill="none" stroke="white" stroke-width="2"/>
  <text x="955" y="185" class="h2">RC522 RFID Modul</text>
  <text x="955" y="218" class="body">Liest RFID-Karten, Tags oder Schlüsselanhänger.</text>
  <text x="955" y="246" class="small">Wird per SPI an den ESP32-C3 angeschlossen.</text>

  <rect x="50" y="310" width="720" height="150" rx="18" fill="#ecfccb" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="115" cy="385" r="40" fill="white" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="115" cy="385" r="24" fill="#111827"/><circle cx="115" cy="385" r="4" fill="white"/>
  <text x="175" y="355" class="h2">Passiver Piezo-Buzzer</text>
  <text x="175" y="388" class="body">Gibt OK-, Fehler- und Alarmtöne über RTTTL aus.</text>
  <text x="175" y="416" class="small">Wichtig: passiv, nicht aktiv.</text>

  <rect x="830" y="310" width="720" height="150" rx="18" fill="#fae8ff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="895" cy="385" r="40" fill="white" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="890" cy="380" r="16" fill="#ef4444"/>
  <line x1="890" y1="396" x2="890" y2="422" stroke="#111827" stroke-width="3"/>
  <line x1="900" y1="396" x2="900" y2="422" stroke="#111827" stroke-width="2"/>
  <polyline points="864,412 873,404 882,420 891,404 900,420 909,412" fill="none" stroke="#a16207" stroke-width="3"/>
  <text x="955" y="355" class="h2">LED + 220 Ω Widerstand</text>
  <text x="955" y="388" class="body">Optionale Statusanzeige für Scan / Feedback.</text>
  <text x="955" y="416" class="small">Anode an GPIO2 über Vorwiderstand, Kathode an GND.</text>

  <rect x="50" y="480" width="720" height="150" rx="18" fill="#fff7ed" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="115" cy="555" r="40" fill="white" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="100" y1="530" x2="100" y2="580" stroke="#475569" stroke-width="3"/>
  <line x1="110" y1="530" x2="110" y2="580" stroke="#475569" stroke-width="3"/>
  <line x1="120" y1="530" x2="120" y2="580" stroke="#475569" stroke-width="3"/>
  <line x1="130" y1="530" x2="130" y2="580" stroke="#475569" stroke-width="3"/>
  <text x="175" y="525" class="h2">Jumper-Kabel</text>
  <text x="175" y="558" class="body">Für die Verdrahtung aller Module.</text>
  <text x="175" y="586" class="small">Dupont Female–Female bzw. passend zum Board.</text>

  <rect x="830" y="480" width="720" height="150" rx="18" fill="#fef3c7" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="895" cy="555" r="40" fill="white" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="872" y="532" width="46" height="46" rx="6" fill="white" stroke="#94a3b8"/>
  <circle cx="918" cy="578" r="8" fill="none" stroke="#64748b" stroke-width="3"/>
  <text x="955" y="525" class="h2">RFID Tag / Karte</text>
  <text x="955" y="558" class="body">Zum Testen und späteren Betrieb.</text>
  <text x="955" y="586" class="small">Kann in Home Assistant als Tag-Ereignis genutzt werden.</text>

  <rect x="50" y="650" width="720" height="150" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="115" cy="725" r="40" fill="white" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="94" y="698" width="42" height="54" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="175" y="695" class="h2">USB-Kabel + 5 V Versorgung</text>
  <text x="175" y="728" class="body">Für Flashen und Stromversorgung des ESP32-C3.</text>
  <text x="175" y="756" class="small">Je nach Board meistens USB-C.</text>

  <rect x="830" y="650" width="720" height="150" rx="18" fill="#dcfce7" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="895" cy="725" r="40" fill="white" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="880" cy="725" r="10" fill="#2563eb"/><circle cx="910" cy="725" r="10" fill="#16a34a"/><circle cx="895" cy="705" r="10" fill="#f59e0b"/>
  <text x="955" y="695" class="h2">Home Assistant + ESPHome + HACS</text>
  <text x="955" y="728" class="body">Software-Seite des Projekts.</text>
  <text x="955" y="756" class="small">ESPHome, Button Card, optional card-mod.</text>

  <rect x="50" y="830" width="1500" height="40" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="70" y="856" class="body">Empfehlung: zuerst Hardware aufbauen, danach ESPHome flashen und zuletzt das Dashboard in Home Assistant einfügen.</text>
</svg>