<text x="50" y="65" class="title">ESP32-C3 + RC522 RFID Terminal – Verdrahtungsplan</text><text x="50" y="100" class="subtitle">Klare, technische Darstellung für GitHub / Home Assistant / ESPHome</text><rect x="50" y="140" width="520" height="860" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="75" y="175" class="h2">ESP32-C3 DevKitM-1</text><rect x="160" y="230" width="250" height="620" rx="24" fill="#1e293b" stroke="#0b1220" stroke-width="2"/><rect x="205" y="270" width="160" height="130" rx="10" fill="#cbd5e1" stroke="#94a3b8"/><text x="233" y="325" class="body">ESP32-C3</text><text x="218" y="352" class="small">DevKitM-1 Modul</text><text x="80" y="295" class="pin">3V3</text><line x1="410" y1="290" x2="425" y2="290" stroke="#64748b" stroke-width="4"/><circle cx="428" cy="290" r="4" fill="#64748b"/><text x="80" y="355" class="pin">GPIO2</text><line x1="410" y1="350" x2="425" y2="350" stroke="#64748b" stroke-width="4"/><circle cx="428" cy="350" r="4" fill="#64748b"/><text x="80" y="435" class="pin">GPIO5</text><line x1="410" y1="430" x2="425" y2="430" stroke="#64748b" stroke-width="4"/><circle cx="428" cy="430" r="4" fill="#64748b"/><text x="80" y="495" class="pin">GPIO6</text><line x1="410" y1="490" x2="425" y2="490" stroke="#64748b" stroke-width="4"/><circle cx="428" cy="490" r="4" fill="#64748b"/><text x="80" y="555" class="pin">GPIO7</text><line x1="410" y1="550" x2="425" y2="550" stroke="#64748b" stroke-width="4"/><circle cx="428" cy="550" r="4" fill="#64748b"/><text x="80" y="615" class="pin">GPIO8</text><line x1="410" y1="610" x2="425" y2="610" stroke="#64748b" stroke-width="4"/><circle cx="428" cy="610" r="4" fill="#64748b"/><text x="80" y="675" class="pin">GPIO9</text><line x1="410" y1="670" x2="425" y2="670" stroke="#64748b" stroke-width="4"/><circle cx="428" cy="670" r="4" fill="#64748b"/><text x="80" y="735" class="pin">GPIO10</text><line x1="410" y1="730" x2="425" y2="730" stroke="#64748b" stroke-width="4"/><circle cx="428" cy="730" r="4" fill="#64748b"/><text x="80" y="795" class="pin">GND</text><line x1="410" y1="790" x2="425" y2="790" stroke="#64748b" stroke-width="4"/><circle cx="428" cy="790" r="4" fill="#64748b"/><rect x="650" y="160" width="520" height="560" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="675" y="195" class="h2">RC522 RFID Modul</text><rect x="770" y="250" width="220" height="260" rx="14" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/><path d="M 867.5 355 A 25 25 0 0 0 867.5 405" fill="none" stroke="white" stroke-width="3"/><path d="M 892.5 355 A 25 25 0 0 1 892.5 405" fill="none" stroke="white" stroke-width="3"/><path d="M 857.5 335 A 45 45 0 0 0 857.5 425" fill="none" stroke="white" stroke-width="3"/><path d="M 902.5 335 A 45 45 0 0 1 902.5 425" fill="none" stroke="white" stroke-width="3"/><path d="M 847.5 315 A 65 65 0 0 0 847.5 445" fill="none" stroke="white" stroke-width="3"/><path d="M 912.5 315 A 65 65 0 0 1 912.5 445" fill="none" stroke="white" stroke-width="3"/><text x="840" y="295" class="body" fill="white">MFRC522</text><text x="836" y="495" class="small" fill="white">Nur mit 3.3 V betreiben</text><text x="680" y="235" class="small">RC522-Pinbelegung</text><text x="680" y="290" class="pin">SDA / SS</text><line x1="745" y1="285" x2="770" y2="285" stroke="#94a3b8" stroke-width="2"/><circle cx="770" cy="285" r="4" fill="#111827"/><text x="1010" y="290" class="small">→ GPIO7</text><text x="680" y="320" class="pin">SCK</text><line x1="745" y1="315" x2="770" y2="315" stroke="#94a3b8" stroke-width="2"/><circle cx="770" cy="315" r="4" fill="#111827"/><text x="1010" y="320" class="small">→ GPIO9</text><text x="680" y="350" class="pin">MOSI</text><line x1="745" y1="345" x2="770" y2="345" stroke="#94a3b8" stroke-width="2"/><circle cx="770" cy="345" r="4" fill="#111827"/><text x="1010" y="350" class="small">→ GPIO6</text><text x="680" y="380" class="pin">MISO</text><line x1="745" y1="375" x2="770" y2="375" stroke="#94a3b8" stroke-width="2"/><circle cx="770" cy="375" r="4" fill="#111827"/><text x="1010" y="380" class="small">→ GPIO5</text><text x="680" y="410" class="pin">RST</text><line x1="745" y1="405" x2="770" y2="405" stroke="#94a3b8" stroke-width="2"/><circle cx="770" cy="405" r="4" fill="#111827"/><text x="1010" y="410" class="small">→ GPIO10</text><text x="680" y="440" class="pin">3.3V</text><line x1="745" y1="435" x2="770" y2="435" stroke="#94a3b8" stroke-width="2"/><circle cx="770" cy="435" r="4" fill="#111827"/><text x="1010" y="440" class="small">→ 3V3</text><text x="680" y="470" class="pin">GND</text><line x1="745" y1="465" x2="770" y2="465" stroke="#94a3b8" stroke-width="2"/><circle cx="770" cy="465" r="4" fill="#111827"/><text x="1010" y="470" class="small">→ GND</text><rect x="50" y="1025" width="520" height="135" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="75" y="1060" class="h2">Passiver Buzzer</text><circle cx="150" cy="1110" r="38" fill="#111827"/><circle cx="150" cy="1110" r="7" fill="#e5e7eb"/><line x1="138" y1="1148" x2="138" y2="1180" stroke="#111827" stroke-width="3"/><line x1="162" y1="1148" x2="162" y2="1180" stroke="#111827" stroke-width="3"/><text x="250" y="1104" class="body">Plus → GPIO8</text><text x="250" y="1134" class="body">Minus → GND</text><rect x="650" y="760" width="520" height="300" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="675" y="795" class="h2">Status-LED mit Vorwiderstand</text><text x="675" y="823" class="small">Sauberer Strompfad: GPIO2 → 220 Ω → LED-Anode → LED-Kathode → GND</text><text x="690" y="912" class="pin" fill="#db2777">GPIO2</text><line x1="710" y1="930" x2="750" y2="930" stroke="#db2777" stroke-width="4"/><polyline points="750,930 760,920 770,940 780,920 790,940 800,920 810,940 820,930" fill="none" stroke="#a16207" stroke-width="4"/><text x="758" y="965" class="small">220 Ω</text><line x1="820" y1="930" x2="880" y2="930" stroke="#db2777" stroke-width="4"/><line x1="880" y1="930" x2="910" y2="930" stroke="#111827" stroke-width="4"/><polygon points="910,908 910,952 944,930" fill="#f87171" stroke="#b91c1c" stroke-width="2"/><line x1="952" y1="902" x2="952" y2="958" stroke="#111827" stroke-width="4"/><line x1="920" y1="890" x2="940" y2="870" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow)"/><line x1="932" y1="902" x2="952" y2="882" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow)"/><text x="900" y="988" class="small">LED</text><text x="892" y="1010" class="tiny">Anode</text><text x="934" y="1010" class="tiny">Kathode</text><line x1="952" y1="930" x2="1030" y2="930" stroke="#111827" stroke-width="4"/><line x1="1030" y1="930" x2="1030" y2="985" stroke="#111827" stroke-width="4"/><line x1="1010" y1="985" x2="1050" y2="985" stroke="#111827" stroke-width="3"/><line x1="1015" y1="993" x2="1045" y2="993" stroke="#111827" stroke-width="3"/><line x1="1021" y1="1001" x2="1039" y2="1001" stroke="#111827" stroke-width="3"/><text x="1005" y="1028" class="small">GND</text><rect x="1250" y="140" width="500" height="920" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="1275" y="175" class="h2">Anschlussübersicht</text><rect x="1275" y="205" width="450" height="42" fill="#e2e8f0" stroke="#cbd5e1"/><text x="1295" y="232" class="tablehead">Signal</text><text x="1505" y="232" class="tablehead">Ziel</text><rect x="1275" y="252" width="450" height="38" fill="white" stroke="#cbd5e1"/><text x="1292" y="276" class="tablerow">RC522 SDA / SS</text><text x="1505" y="276" class="tablerow">GPIO7</text><rect x="1275" y="294" width="450" height="38" fill="white" stroke="#cbd5e1"/><text x="1292" y="318" class="tablerow">RC522 SCK</text><text x="1505" y="318" class="tablerow">GPIO9</text><rect x="1275" y="336" width="450" height="38" fill="white" stroke="#cbd5e1"/><text x="1292" y="360" class="tablerow">RC522 MOSI</text><text x="1505" y="360" class="tablerow">GPIO6</text><rect x="1275" y="378" width="450" height="38" fill="white" stroke="#cbd5e1"/><text x="1292" y="402" class="tablerow">RC522 MISO</text><text x="1505" y="402" class="tablerow">GPIO5</text><rect x="1275" y="420" width="450" height="38" fill="white" stroke="#cbd5e1"/><text x="1292" y="444" class="tablerow">RC522 RST</text><text x="1505" y="444" class="tablerow">GPIO10</text><rect x="1275" y="462" width="450" height="38" fill="white" stroke="#cbd5e1"/><text x="1292" y="486" class="tablerow">RC522 3.3V</text><text x="1505" y="486" class="tablerow">3V3</text><rect x="1275" y="504" width="450" height="38" fill="white" stroke="#cbd5e1"/><text x="1292" y="528" class="tablerow">RC522 GND</text><text x="1505" y="528" class="tablerow">GND</text><rect x="1275" y="546" width="450" height="38" fill="white" stroke="#cbd5e1"/><text x="1292" y="570" class="tablerow">Buzzer +</text><text x="1505" y="570" class="tablerow">GPIO8</text><rect x="1275" y="588" width="450" height="38" fill="white" stroke="#cbd5e1"/><text x="1292" y="612" class="tablerow">Buzzer -</text><text x="1505" y="612" class="tablerow">GND</text><rect x="1275" y="630" width="450" height="38" fill="white" stroke="#cbd5e1"/><text x="1292" y="654" class="tablerow">LED Anode</text><text x="1505" y="654" class="tablerow">GPIO2 via 220 Ω</text><rect x="1275" y="672" width="450" height="38" fill="white" stroke="#cbd5e1"/><text x="1292" y="696" class="tablerow">LED Kathode</text><text x="1505" y="696" class="tablerow">GND</text><rect x="1275" y="760" width="450" height="250" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="1300" y="800" class="warn">Wichtig</text><text x="1300" y="835" class="body">• RC522 nur mit 3.3 V betreiben.</text><text x="1300" y="868" class="body">• 5 V können das Modul dauerhaft beschädigen.</text><text x="1300" y="901" class="body">• Für die LED immer einen Vorwiderstand verwenden.</text><text x="1300" y="934" class="body">• Für RTTTL einen passiven Piezo-Buzzer benutzen.</text><text x="1300" y="967" class="body">• Alle GND-Verbindungen müssen gemeinsam verbunden sein.</text><polyline points="428,550 720,550 720,285 745,285" fill="none" stroke="#ca8a04" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="428,670 800,670 800,315 745,315" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="428,490 680,490 680,345 745,345" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="428,430 640,430 640,375 745,375" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="428,730 840,730 840,405 745,405" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="428,290 560,290 560,435 745,435" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="428,790 880,790 880,465 745,465" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="428,610 760,610 760,1095 220,1095" fill="none" stroke="#92400e" stroke-width="4"/><text x="530" y="1088" class="small" fill="#92400e">GPIO8 → Buzzer +</text><polyline points="428,790 880,790 880,1125 220,1125" fill="none" stroke="#111827" stroke-width="4"/><text x="530" y="1120" class="small">GND → Buzzer -</text><polyline points="428,350 600,350 600,930 710,930" fill="none" stroke="#db2777" stroke-width="4"/><text x="600" y="918" class="small" fill="#db2777">GPIO2 → 220 Ω → LED-Anode</text><polyline points="428,790 880,790 880,985 1030,985" fill="none" stroke="#111827" stroke-width="4"/><text x="905" y="975" class="small">GND → LED-Kathode</text><text x="1275" y="1088" class="small">Farbcode: Rot = 3.3V, Schwarz = GND, Pink = LED, Braun = Buzzer, weitere Farben = RC522-Signale</text><text x="50" y="1180" class="small">Version 2 – größere Beschriftungen, saubere Leitungsführung und korrekt dargestellte LED-Verschaltung</text></svg>