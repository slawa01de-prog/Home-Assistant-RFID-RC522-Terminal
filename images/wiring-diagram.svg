<text x="820" y="900" class="small">Schaltungsprinzip: GPIO2 → 220 Ω → LED → GND</text><rect x="820" y="1045" width="620" height="58" rx="14" fill="white" stroke="#cbd5e1"/><text x="845" y="1080" class="body">Anode = linkes LED-Bein. Kathode = rechtes LED-Bein in Richtung GND.</text>
<circle cx="220" cy="1272" r="44" fill="#111827"/><circle cx="220" cy="1272" r="8" fill="#f8fafc"/><line x1="206" y1="1316" x2="206" y2="1354" stroke="#111827" stroke-width="4"/><line x1="234" y1="1316" x2="234" y2="1354" stroke="#111827" stroke-width="4"/><text x="340" y="1264" class="body">Plus → GPIO8</text><text x="340" y="1298" class="body">Minus → GND</text><text x="340" y="1332" class="small">Für RTTTL bitte einen passiven Buzzer verwenden.</text>
