<rect x="1580" y="576" width="530" height="42" fill="white" stroke="#cbd5e1"/><text x="1600" y="602" class="tab">Buzzer +</text><text x="1850" y="602" class="tab">GPIO8</text>
<rect x="1580" y="620" width="530" height="42" fill="white" stroke="#cbd5e1"/><text x="1600" y="646" class="tab">Buzzer -</text><text x="1850" y="646" class="tab">GND</text>
<rect x="1580" y="664" width="530" height="42" fill="white" stroke="#cbd5e1"/><text x="1600" y="690" class="tab">LED Anode</text><text x="1850" y="690" class="tab">GPIO2 über 220 Ω</text>
<rect x="1580" y="708" width="530" height="42" fill="white" stroke="#cbd5e1"/><text x="1600" y="734" class="tab">LED Kathode</text><text x="1850" y="734" class="tab">GND</text>
<rect x="1580" y="760" width="530" height="320" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="1608" y="805" class="h2" fill="#9a3412">Wichtig</text><text x="1608" y="848" class="body">• RC522 immer nur mit 3.3 V betreiben.</text><text x="1608" y="896" class="body">• 5 V können das RC522-Modul beschädigen.</text><text x="1608" y="944" class="body">• Für die LED immer einen Vorwiderstand verwenden.</text><text x="1608" y="992" class="body">• Alle GND-Leitungen müssen gemeinsam verbunden sein.</text><text x="1608" y="1040" class="body">• Für Töne/Melodien einen passiven Buzzer verwenden.</text>
