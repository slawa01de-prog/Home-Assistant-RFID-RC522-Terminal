<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
    <defs>
      <style>
        .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
        .subtitle { font: 600 18px Arial, sans-serif; fill: #475569; }
        .h2 { font: 700 20px Arial, sans-serif; fill: #0f172a; }
        .body { font: 15px Arial, sans-serif; fill: #0f172a; }
        .small { font: 13px Arial, sans-serif; fill: #475569; }
        .tiny { font: 12px Arial, sans-serif; fill: #475569; }
        .mono { font: 700 14px Courier New, monospace; fill: #0f172a; }
        .pin { font: 700 13px Arial, sans-serif; fill: #0f172a; }
      </style>
    </defs>
    <rect x="0" y="0" width="1600" height="1100" fill="white"/>
    <text x="50" y="60" class="title">ESP32-C3 + RC522 RFID Terminal – Verdrahtungsplan</text>
    <text x="50" y="95" class="subtitle">Exakte Zuordnung für Home Assistant / ESPHome – RC522, Buzzer und LED</text>

    <rect x="70" y="150" width="430" height="760" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="110" y="190" class="h2">ESP32-C3 DevKitM-1</text>
    <rect x="160" y="240" width="250" height="520" rx="18" fill="#1e293b" stroke="#0b1220" stroke-width="2"/>
    <rect x="205" y="275" width="160" height="120" rx="10" fill="#cbd5e1" stroke="#94a3b8"/>
    <text x="223" y="330" class="body" fill="#111827">ESP32-C3</text>
    <text x="208" y="355" class="small" fill="#111827">DevKitM-1 Modul</text>

    <g class="pin">
      <text x="65" y="305">3V3</text><circle cx="415" cy="300" r="6" fill="#f8fafc" stroke="#94a3b8"/>
      <text x="65" y="370">GPIO5</text><circle cx="415" cy="365" r="6" fill="#f8fafc" stroke="#94a3b8"/>
      <text x="65" y="430">GPIO6</text><circle cx="415" cy="425" r="6" fill="#f8fafc" stroke="#94a3b8"/>
      <text x="65" y="490">GPIO7</text><circle cx="415" cy="485" r="6" fill="#f8fafc" stroke="#94a3b8"/>
      <text x="65" y="550">GPIO8</text><circle cx="415" cy="545" r="6" fill="#f8fafc" stroke="#94a3b8"/>
      <text x="65" y="610">GPIO9</text><circle cx="415" cy="605" r="6" fill="#f8fafc" stroke="#94a3b8"/>
      <text x="65" y="670">GPIO10</text><circle cx="415" cy="665" r="6" fill="#f8fafc" stroke="#94a3b8"/>
      <text x="65" y="730">GND</text><circle cx="415" cy="725" r="6" fill="#f8fafc" stroke="#94a3b8"/>
      <text x="65" y="345">GPIO2</text><circle cx="415" cy="340" r="6" fill="#f8fafc" stroke="#94a3b8"/>
    </g>

    <rect x="650" y="210" width="360" height="420" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="745" y="250" class="h2">RC522 RFID Modul</text>
    <rect x="735" y="300" width="190" height="220" rx="12" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
    <text x="786" y="345" class="body" fill="white">MFRC522</text>
    <path d="M 810 404 A 26 26 0 0 0 810 456" fill="none" stroke="white" stroke-width="3"/>
    <path d="M 850 404 A 26 26 0 0 1 850 456" fill="none" stroke="white" stroke-width="3"/>
    <path d="M 810 384 A 46 46 0 0 0 810 476" fill="none" stroke="white" stroke-width="3"/>
    <path d="M 850 384 A 46 46 0 0 1 850 476" fill="none" stroke="white" stroke-width="3"/>
    <path d="M 810 364 A 66 66 0 0 0 810 496" fill="none" stroke="white" stroke-width="3"/>
    <path d="M 850 364 A 66 66 0 0 1 850 496" fill="none" stroke="white" stroke-width="3"/>
    <text x="780" y="555" class="small">Nur 3.3 V!</text>

    <g class="tiny">
      <text x="738" y="275">SDA/SS</text><circle cx="760" cy="290" r="6" fill="#111827"/>
      <text x="768" y="275">SCK</text><circle cx="790" cy="290" r="6" fill="#111827"/>
      <text x="798" y="275">MOSI</text><circle cx="820" cy="290" r="6" fill="#111827"/>
      <text x="828" y="275">MISO</text><circle cx="850" cy="290" r="6" fill="#111827"/>
      <text x="858" y="275">RST</text><circle cx="880" cy="290" r="6" fill="#111827"/>
      <text x="888" y="275">3.3V</text><circle cx="910" cy="290" r="6" fill="#111827"/>
      <text x="918" y="275">GND</text><circle cx="940" cy="290" r="6" fill="#111827"/>
    </g>

    <polyline points="415,485 560,485 560,210 760,210 760,290" fill="none" stroke="#ca8a04" stroke-width="5"/>
    <text x="575" y="202" class="small" fill="#ca8a04">GPIO7 → SDA/SS</text>
    <polyline points="415,605 560,605 560,170 790,170 790,290" fill="none" stroke="#16a34a" stroke-width="5"/>
    <text x="575" y="162" class="small" fill="#16a34a">GPIO9 → SCK</text>
    <polyline points="415,425 560,425 560,240 820,240 820,290" fill="none" stroke="#1f5fbf" stroke-width="5"/>
    <text x="575" y="232" class="small" fill="#1f5fbf">GPIO6 → MOSI</text>
    <polyline points="415,365 560,365 560,270 850,270 850,290" fill="none" stroke="#7c3aed" stroke-width="5"/>
    <text x="575" y="262" class="small" fill="#7c3aed">GPIO5 → MISO</text>
    <polyline points="415,665 560,665 560,300 880,300 880,290" fill="none" stroke="#ea580c" stroke-width="5"/>
    <text x="575" y="292" class="small" fill="#ea580c">GPIO10 → RST</text>
    <polyline points="415,300 560,300 560,140 910,140 910,290" fill="none" stroke="#dc2626" stroke-width="5"/>
    <text x="575" y="132" class="small" fill="#dc2626">3V3 → 3.3V</text>
    <polyline points="415,725 560,725 560,190 940,190 940,290" fill="none" stroke="#111827" stroke-width="5"/>
    <text x="575" y="182" class="small">GND → GND</text>

    <rect x="90" y="930" width="430" height="120" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="110" y="965" class="h2">Passiver Buzzer</text>
    <circle cx="220" cy="1010" r="36" fill="#111827"/>
    <text x="285" y="1008" class="body">Plus → GPIO8</text>
    <text x="285" y="1035" class="body">Minus → GND</text>
    <polyline points="415,545 540,545 540,990 255,990" fill="none" stroke="#92400e" stroke-width="5"/>
    <polyline points="415,725 520,725 520,1030 255,1030" fill="none" stroke="#111827" stroke-width="5"/>

    <rect x="610" y="700" width="450" height="250" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="630" y="735" class="h2">Status-LED</text>
    <text x="630" y="760" class="small">Anode über 220 Ω an GPIO2, Kathode an GND</text>
    <circle cx="780" cy="835" r="22" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
    <polyline points="640,875 650,865 660,885 670,865 680,885 690,865 700,885 710,875" fill="none" stroke="#a16207" stroke-width="4"/>
    <line x1="710" y1="875" x2="772" y2="875" stroke="#db2777" stroke-width="4"/>
    <line x1="788" y1="875" x2="845" y2="875" stroke="#111827" stroke-width="3"/>
    <text x="666" y="905" class="small">220 Ω</text>
    <polyline points="415,340 580,340 580,875 640,875" fill="none" stroke="#db2777" stroke-width="5"/>
    <polyline points="415,725 560,725 560,930 845,930 845,875" fill="none" stroke="#111827" stroke-width="5"/>

    <rect x="1090" y="150" width="450" height="800" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1115" y="190" class="h2">Anschlussübersicht</text>
    <rect x="1115" y="215" width="400" height="40" fill="#e2e8f0" stroke="#cbd5e1"/>
    <text x="1130" y="240" class="body">Signal</text><text x="1300" y="240" class="body">Ziel</text>
    <g class="body">
      <text x="1130" y="281">RC522 SDA / SS</text><text x="1300" y="281">GPIO7</text>
      <text x="1130" y="327">RC522 SCK</text><text x="1300" y="327">GPIO9</text>
      <text x="1130" y="373">RC522 MOSI</text><text x="1300" y="373">GPIO6</text>
      <text x="1130" y="419">RC522 MISO</text><text x="1300" y="419">GPIO5</text>
      <text x="1130" y="465">RC522 RST</text><text x="1300" y="465">GPIO10</text>
      <text x="1130" y="511">RC522 3.3V</text><text x="1300" y="511">3V3</text>
      <text x="1130" y="557">RC522 GND</text><text x="1300" y="557">GND</text>
      <text x="1130" y="603">Buzzer +</text><text x="1300" y="603">GPIO8</text>
      <text x="1130" y="649">Buzzer -</text><text x="1300" y="649">GND</text>
      <text x="1130" y="695">LED Anode</text><text x="1300" y="695">GPIO2 via 220 Ω</text>
      <text x="1130" y="741">LED Kathode</text><text x="1300" y="741">GND</text>
    </g>
    <rect x="1115" y="770" width="400" height="140" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="1145" y="810" class="h2" fill="#dc2626">Wichtig</text>
    <text x="1145" y="840" class="body">• RC522 nur mit 3.3 V betreiben.</text>
    <text x="1145" y="866" class="body">• 5 V können das Modul beschädigen.</text>
    <text x="1145" y="892" class="body">• LED immer mit Vorwiderstand.</text>
    <text x="1145" y="918" class="body">• Für RTTTL: passiver Buzzer.</text>
</svg>