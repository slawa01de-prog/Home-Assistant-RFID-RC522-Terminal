<text x="780" y="991" class="small" fill="#db2777">GPIO2 → Widerstand → LED-Anode</text><text x="890" y="1274" class="small" fill="#92400e">GPIO8 → Buzzer +</text><text x="1010" y="1336" class="small">GND → Buzzer - / LED / RC522</text><text x="60" y="1370" class="small">V3: größere Beschriftungen, echte kleine LED-Schaltung, RC522-Pinliste und ruhigere Leitungsführung.</text>
