<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
    <defs>
      <style>
        .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
        .subtitle { font: 600 18px Arial, sans-serif; fill: #475569; }
        .h2 { font: 700 20px Arial, sans-serif; fill: #0f172a; }
        .body { font: 15px Arial, sans-serif; fill: #0f172a; }
        .small { font: 13px Arial, sans-serif; fill: #475569; }
        .tiny { font: 12px Arial, sans-serif; fill: #475569; }
        .mono { font: 700 14px Courier New, monospace; fill: #0f172a; }
        .pin { font: 700 13px Arial, sans-serif; fill: #0f172a; }
      </style>
      <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polygon points="0,0 10,4 0,8" fill="#0f172a"/>
      </marker>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e3a8a"/></linearGradient>
    </defs>
    <rect x="0" y="0" width="1600" height="520" fill="url(#bg)"/>
    <text x="70" y="90" style="font:700 42px Arial,sans-serif; fill:white;">Home Assistant RFID RC522 Terminal</text>
    <text x="70" y="130" style="font:600 22px Arial,sans-serif; fill:#bfdbfe;">ESP32-C3 • ESPHome • RC522 • Tablet Dashboard • HACS Button Card</text>
    <rect x="70" y="180" width="620" height="240" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="100" y="225" style="font:700 28px Arial,sans-serif; fill:white;">Was das Projekt bietet</text>
    <circle cx="108" cy="265" r="5" fill="#38bdf8"/><text x="125" y="270" style="font:18px Arial,sans-serif; fill:#e2e8f0;">RFID-Tags direkt an Home Assistant senden</text>
    <circle cx="108" cy="303" r="5" fill="#38bdf8"/><text x="125" y="308" style="font:18px Arial,sans-serif; fill:#e2e8f0;">Buzzer- und LED-Feedback</text>
    <circle cx="108" cy="341" r="5" fill="#38bdf8"/><text x="125" y="346" style="font:18px Arial,sans-serif; fill:#e2e8f0;">Tabletfreundliches Dashboard ohne Scrollen</text>
    <circle cx="108" cy="379" r="5" fill="#38bdf8"/><text x="125" y="384" style="font:18px Arial,sans-serif; fill:#e2e8f0;">Saubere Dokumentation mit Verdrahtungsplan</text>
    <rect x="850" y="90" width="680" height="340" rx="24" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <rect x="900" y="150" width="230" height="200" rx="18" fill="#0b1220" stroke="#38bdf8"/>
    <text x="940" y="190" style="font:700 22px Arial,sans-serif; fill:white;">RFID TERMINAL</text>
    <text x="955" y="310" style="font:700 22px Arial,sans-serif; fill:#22c55e;">READY TO SCAN</text>
    <line x1="950" y1="250" x2="1080" y2="250" stroke="#38bdf8" stroke-width="4"/>
    <rect x="1180" y="150" width="300" height="80" rx="16" fill="#16a34a"/><text x="1255" y="198" style="font:700 24px Arial,sans-serif; fill:white;">Zugriff erlaubt</text>
    <rect x="1180" y="250" width="300" height="80" rx="16" fill="#dc2626"/><text x="1240" y="298" style="font:700 24px Arial,sans-serif; fill:white;">Zugriff verweigert</text>
    <rect x="1180" y="350" width="140" height="40" rx="10" fill="#e2e8f0"/><text x="1214" y="376" class="body">Buzzer</text>
    <rect x="1340" y="350" width="140" height="40" rx="10" fill="#e2e8f0"/><text x="1386" y="376" class="body">LED</text>
</svg>