    <rect x="725" y="397" width="290" height="82" rx="16" fill="#ef334d"/><text x="870" y="447" fill="#fff">! Zugriff verweigert</text>
    <rect x="725" y="494" width="290" height="82" rx="16" fill="#168fe5"/><text x="870" y="544" fill="#fff">♪ Erfolg Melodie</text>
    <rect x="725" y="591" width="290" height="82" rx="16" fill="#f5962d"/><text x="870" y="641" fill="#fff">⚠ Alarm Ton</text>
  </g>

  <text x="1110" y="265" class="t mid" fill="#fff">RFID Steuerung</text>
