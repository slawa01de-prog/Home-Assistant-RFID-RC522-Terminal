  <line x1="220" y1="455" x2="590" y2="455" stroke="url(#scan)" stroke-width="12"/>
  <rect x="375" y="388" width="60" height="95" rx="12" fill="none" stroke="#64b5f6" stroke-width="6" transform="rotate(-8 405 435)"/>
  <path d="M350 405 q-55 35 0 70 M462 405 q55 35 0 70" fill="none" stroke="#64b5f6" stroke-width="7" stroke-linecap="round"/>
  <circle cx="195" cy="612" r="9" fill="#1fe67a"/>
  <text x="218" y="620" class="t mid" fill="#1fe67a">SYSTEM ONLINE</text>
  <text x="250" y="665" class="t mid" fill="#d7e7f3">READY TO SCAN</text>

  <text x="730" y="265" class="t mid" fill="#fff">RFID Testkonsole</text>
