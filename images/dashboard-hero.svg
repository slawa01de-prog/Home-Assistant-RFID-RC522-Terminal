    <rect x="430" y="790" width="280" height="70" rx="18" fill="#102437"/><text x="570" y="823" class="label" fill="#5ec4ff">RC522</text><text x="570" y="848" class="small muted">13.56 MHz RFID</text>
    <rect x="740" y="790" width="280" height="70" rx="18" fill="#102437"/><text x="880" y="823" class="label" fill="#5ec4ff">Home Assistant</text><text x="880" y="848" class="small muted">Full Integration</text>
    <rect x="1050" y="790" width="280" height="70" rx="18" fill="#102437"/><text x="1190" y="823" class="label" fill="#5ec4ff">HACS</text><text x="1190" y="848" class="small muted">Button Card</text>
