<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081421"/><stop offset="1" stop-color="#10283d"/></linearGradient>
    <linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#1976d2" stop-opacity="0"/><stop offset="0.5" stop-color="#42a5f5"/><stop offset="1" stop-color="#1976d2" stop-opacity="0"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-opacity=".35"/></filter>
    <style>.t{font-family:Arial,Helvetica,sans-serif}.muted{fill:#93a8ba}.card{fill:#0d1d2d;stroke:#2e526f;stroke-width:2}.small{font-size:20px}.label{font-size:23px;font-weight:700}.big{font-size:44px;font-weight:800}.mid{font-size:28px;font-weight:700}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="90" y="85" class="t big" fill="#44b7ff">ESP32-C3 + RC522</text>
  <text x="505" y="85" class="t big" fill="#fff">RFID Terminal for Home Assistant</text>
  <text x="92" y="125" class="t small muted">ESPHome • Tablet Dashboard • HACS Button Card • Open Source</text>

  <g filter="url(#shadow)">
    <rect x="110" y="170" width="1380" height="590" rx="30" fill="#07111b" stroke="#4b6f8b" stroke-width="3"/>
    <rect x="145" y="215" width="520" height="500" rx="22" class="card"/>
    <rect x="690" y="215" width="360" height="500" rx="22" class="card"/>
    <rect x="1075" y="215" width="380" height="500" rx="22" class="card"/>
