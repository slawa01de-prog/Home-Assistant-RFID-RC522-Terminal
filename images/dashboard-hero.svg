    <rect x="1110" y="400" width="310" height="78" rx="15" fill="#102437" stroke="#2f516b"/><text x="1140" y="432" class="label" fill="#fff">Firmware</text><text x="1140" y="460" class="small muted">Version</text><text x="1360" y="449" class="small" fill="#9fc4df">v1.0</text>
    <rect x="1110" y="495" width="310" height="78" rx="15" fill="#102437" stroke="#2f516b"/><text x="1140" y="527" class="label" fill="#fff">Buzzer</text><text x="1140" y="555" class="small muted">Status</text><rect x="1340" y="516" width="58" height="30" rx="15" fill="#2196f3"/><circle cx="1382" cy="531" r="12" fill="#fff"/>
    <rect x="1110" y="590" width="310" height="78" rx="15" fill="#102437" stroke="#2f516b"/><text x="1140" y="622" class="label" fill="#fff">LED</text><text x="1140" y="650" class="small muted">Status</text><rect x="1340" y="611" width="58" height="30" rx="15" fill="#2196f3"/><circle cx="1382" cy="626" r="12" fill="#fff"/>
  </g>

  <g class="t" text-anchor="middle">
