<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbfe"/><stop offset="1" stop-color="#e8f2f8"/></linearGradient><style>.t{font-family:Arial,Helvetica,sans-serif}.h{font-size:50px;font-weight:800}.m{font-size:26px;font-weight:700}.s{font-size:20px}.n{font-size:36px;font-weight:800}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="80" text-anchor="middle" class="t h" fill="#102c43">Installation in 4 Schritten</text>
  <text x="800" y="125" text-anchor="middle" class="t m" fill="#5f7788">Vom leeren ESP32-C3 zum fertigen Home Assistant RFID Terminal</text>

  <g>
    <rect x="85" y="220" width="330" height="430" rx="28" fill="#fff" stroke="#c6d8e5" stroke-width="3"/>
    <rect x="450" y="220" width="330" height="430" rx="28" fill="#fff" stroke="#c6d8e5" stroke-width="3"/>
    <rect x="815" y="220" width="330" height="430" rx="28" fill="#fff" stroke="#c6d8e5" stroke-width="3"/>
    <rect x="1180" y="220" width="330" height="430" rx="28" fill="#fff" stroke="#c6d8e5" stroke-width="3"/>
  </g>
  <g class="t" text-anchor="middle">
    <circle cx="250" cy="285" r="42" fill="#1976d2"/><text x="250" y="298" class="n" fill="#fff">1</text>
    <circle cx="615" cy="285" r="42" fill="#43a047"/><text x="615" y="298" class="n" fill="#fff">2</text>
    <circle cx="980" cy="285" r="42" fill="#8e24aa"/><text x="980" y="298" class="n" fill="#fff">3</text>
    <circle cx="1345" cy="285" r="42" fill="#f57c00"/><text x="1345" y="298" class="n" fill="#fff">4</text>
  </g>

  <!-- step icons -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="175" y="350" width="150" height="140" rx="18" fill="#1f2730" stroke="#1f2730"/><rect x="205" y="375" width="90" height="65" rx="8" fill="#cbd1d5" stroke="none"/><line x1="155" y1="390" x2="175" y2="390" stroke="#1976d2" stroke-width="8"/><line x1="155" y1="430" x2="175" y2="430" stroke="#1976d2" stroke-width="8"/><line x1="325" y1="390" x2="345" y2="390" stroke="#1976d2" stroke-width="8"/><line x1="325" y1="430" x2="345" y2="430" stroke="#1976d2" stroke-width="8"/>
    <path d="M545 360 h140 v115 h-140 z" fill="#0b6da9" stroke="#0b6da9"/><path d="M565 415 q50-60 100 0 q-50 60-100 0" stroke="#fff" stroke-width="6"/>
    <path d="M910 465 l70-95 70 95 z" stroke="#8e24aa" stroke-width="8"/><rect x="940" y="445" width="80" height="60" rx="10" fill="#8e24aa" stroke="#8e24aa"/>
    <rect x="1265" y="355" width="160" height="125" rx="18" stroke="#f57c00" stroke-width="8"/><line x1="1290" y1="390" x2="1400" y2="390" stroke="#f57c00" stroke-width="8"/><line x1="1290" y1="425" x2="1365" y2="425" stroke="#f57c00" stroke-width="8"/>
  </g>

  <g class="t" text-anchor="middle">
    <text x="250" y="545" class="m" fill="#102c43">Verdrahten</text><text x="250" y="582" class="s" fill="#5f7788">RC522, Buzzer und LED</text><text x="250" y="612" class="s" fill="#5f7788">an die GPIOs anschließen</text>
    <text x="615" y="545" class="m" fill="#102c43">ESPHome flashen</text><text x="615" y="582" class="s" fill="#5f7788">YAML übernehmen,</text><text x="615" y="612" class="s" fill="#5f7788">Secrets setzen, installieren</text>
    <text x="980" y="545" class="m" fill="#102c43">Home Assistant</text><text x="980" y="582" class="s" fill="#5f7788">ESPHome integrieren und</text><text x="980" y="612" class="s" fill="#5f7788">RFID-Tag-Ereignisse erlauben</text>
    <text x="1345" y="545" class="m" fill="#102c43">Dashboard</text><text x="1345" y="582" class="s" fill="#5f7788">HACS Button Card laden und</text><text x="1345" y="612" class="s" fill="#5f7788">3 Karten nebeneinander nutzen</text>
  </g>

  <g fill="none" stroke="#86a6bb" stroke-width="8" stroke-linecap="round"><line x1="415" y1="430" x2="450" y2="430"/><polyline points="435,415 450,430 435,445"/><line x1="780" y1="430" x2="815" y2="430"/><polyline points="800,415 815,430 800,445"/><line x1="1145" y1="430" x2="1180" y2="430"/><polyline points="1165,415 1180,430 1165,445"/></g>

  <rect x="180" y="720" width="1240" height="100" rx="24" fill="#102c43"/>
  <text x="800" y="765" text-anchor="middle" class="t m" fill="#5ec4ff">Fertig: RFID scannen → Home Assistant erhält Tag-Event → Automation ausführen</text>
  <text x="800" y="800" text-anchor="middle" class="t s" fill="#d6e7f3">Die exakten Entity-IDs können je nach Gerätename abweichen. Nach dem ersten Start unter Entwicklerwerkzeuge → Zustände prüfen.</text>
