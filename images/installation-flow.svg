<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1100" viewBox="0 0 2200 1100">
<defs>
<style>.title { font: 700 44px Arial, sans-serif; fill: #111827; } .subtitle { font: 600 22px Arial, sans-serif; fill: #475569; } .h2 { font: 700 28px Arial, sans-serif; fill: #111827; } .body { font: 18px Arial, sans-serif; fill: #111827; } .small { font: 15px Arial, sans-serif; fill: #475569; } .tiny { font: 14px Arial, sans-serif; fill: #475569; } .pin { font: 700 18px Arial, sans-serif; fill: #111827; } .tabh { font: 700 18px Arial, sans-serif; fill: #111827; } .tab { font: 16px Arial, sans-serif; fill: #111827; }</style>
<marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><polygon points="0,0 12,5 0,10" fill="#111827"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="60" y="70" class="title">Installation – Schritt für Schritt</text>
<text x="60" y="108" class="subtitle">Vom Verdrahten bis zur fertigen Home-Assistant-Integration im gleichen klaren Doku-Stil</text>
<rect x="60" y="170" width="490" height="700" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="60" y="170" width="490" height="108" rx="24" fill="#dbeafe" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="136" cy="224" r="36" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<path d="M 120 242 L 152 206" stroke="#2563eb" stroke-width="5"/><path d="M 118 208 L 154 240" stroke="#16a34a" stroke-width="5"/>
<text x="190" y="232" class="h2">1. Hardware verdrahten</text><text x="94" y="320" class="body">Aufgabe</text>
<circle cx="98" cy="360" r="4" fill="#2563eb"/><text x="114" y="365" class="body">ESP32-C3, RC522, Buzzer und LED laut Verdrahtungsplan verbinden.</text>
<circle cx="98" cy="418" r="4" fill="#2563eb"/><text x="114" y="423" class="body">RC522 nur mit 3.3 V betreiben.</text>
<circle cx="98" cy="476" r="4" fill="#2563eb"/><text x="114" y="481" class="body">LED-Anode über 220 Ω an GPIO2, Kathode an GND.</text>
<circle cx="98" cy="534" r="4" fill="#2563eb"/><text x="114" y="539" class="body">Buzzer an GPIO8 und GND anschließen.</text>
<rect x="88" y="700" width="434" height="120" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="108" y="738" class="body">Hinweis</text><text x="108" y="780" class="small">Erst den Grundaufbau testen, bevor weitere Erweiterungen folgen.</text>
<line x1="558" y1="520" x2="580" y2="520" stroke="#111827" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="590" y="170" width="490" height="700" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="590" y="170" width="490" height="108" rx="24" fill="#dcfce7" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="666" cy="224" r="36" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="648" y="199" width="36" height="50" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><rect x="656" y="207" width="20" height="26" rx="3" fill="#94a3b8"/>
<text x="720" y="232" class="h2">2. ESPHome konfigurieren + flashen</text><text x="624" y="320" class="body">Aufgabe</text>
<circle cx="628" cy="360" r="4" fill="#2563eb"/><text x="644" y="365" class="body">`rfid-rc522.yaml` in ESPHome übernehmen.</text>
<circle cx="628" cy="418" r="4" fill="#2563eb"/><text x="644" y="423" class="body">Private Werte in `secrets.yaml` eintragen.</text>
<circle cx="628" cy="476" r="4" fill="#2563eb"/><text x="644" y="481" class="body">Konfiguration validieren und auf den ESP32-C3 flashen.</text>
<circle cx="628" cy="534" r="4" fill="#2563eb"/><text x="644" y="539" class="body">Danach Gerät in Home Assistant hinzufügen.</text>
<rect x="618" y="700" width="434" height="120" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="638" y="738" class="body">Hinweis</text><text x="638" y="780" class="small">Logs während des Flashens und ersten Starts offen lassen.</text>
<line x1="1088" y1="520" x2="1110" y2="520" stroke="#111827" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1120" y="170" width="490" height="700" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="1120" y="170" width="490" height="108" rx="24" fill="#fae8ff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="1196" cy="224" r="36" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="1173" y="205" width="46" height="32" rx="6" fill="#2563eb"/><rect x="1180" y="212" width="32" height="18" rx="3" fill="white"/>
<text x="1250" y="232" class="h2">3. HACS + Dashboard einrichten</text><text x="1154" y="320" class="body">Aufgabe</text>
<circle cx="1158" cy="360" r="4" fill="#2563eb"/><text x="1174" y="365" class="body">In HACS die Button Card installieren.</text>
<circle cx="1158" cy="418" r="4" fill="#2563eb"/><text x="1174" y="423" class="body">Optional zusätzlich `card-mod` installieren.</text>
<circle cx="1158" cy="476" r="4" fill="#2563eb"/><text x="1174" y="481" class="body">Drei Dashboard-Abschnitte anlegen.</text>
<circle cx="1158" cy="534" r="4" fill="#2563eb"/><text x="1174" y="539" class="body">01-terminal, 02-testconsole und 03-control einfügen.</text>
<rect x="1148" y="700" width="434" height="120" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="1168" y="738" class="body">Hinweis</text><text x="1168" y="780" class="small">Nach HACS-Installation Browser oder App vollständig neu laden.</text>
<line x1="1618" y1="520" x2="1640" y2="520" stroke="#111827" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1650" y="170" width="490" height="700" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="1650" y="170" width="490" height="108" rx="24" fill="#fef3c7" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="1726" cy="224" r="36" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="1706" y="203" width="40" height="28" rx="5" fill="white" stroke="#94a3b8" stroke-width="2"/><circle cx="1742" cy="231" r="9" fill="none" stroke="#64748b" stroke-width="3"/>
<text x="1780" y="232" class="h2">4. RFID testen + Automationen nutzen</text><text x="1684" y="320" class="body">Aufgabe</text>
<circle cx="1688" cy="360" r="4" fill="#2563eb"/><text x="1704" y="365" class="body">RFID-Tag an den RC522 halten.</text>
<circle cx="1688" cy="418" r="4" fill="#2563eb"/><text x="1704" y="423" class="body">UID im ESPHome-Log kontrollieren.</text>
<circle cx="1688" cy="476" r="4" fill="#2563eb"/><text x="1704" y="481" class="body">In Home Assistant den Tag unter „Tags“ sehen.</text>
<circle cx="1688" cy="534" r="4" fill="#2563eb"/><text x="1704" y="539" class="body">Den Tag für Automationen oder Zutritt verwenden.</text>
<rect x="1678" y="700" width="434" height="120" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="1698" y="738" class="body">Hinweis</text><text x="1698" y="780" class="small">Unter „Entwicklerwerkzeuge → Zustände“ Entity-IDs prüfen.</text>
<rect x="60" y="920" width="2080" height="130" rx="20" fill="#eff6ff" stroke="#bfdbfe"/><text x="88" y="962" class="h2">Empfohlene Reihenfolge</text><text x="100" y="996" class="body">• 1. Zuerst Hardware korrekt verdrahten</text><text x="100" y="1022" class="body">• 2. Dann ESPHome flashen und Gerät online bringen</text><text x="100" y="1048" class="body">• 3. Danach HACS / Dashboard einrichten</text><text x="100" y="1074" class="body">• 4. Erst zuletzt Tags und Entity-IDs final prüfen</text>
</svg>