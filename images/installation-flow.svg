<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 600 18px Arial, sans-serif; fill: #475569; }
      .h2 { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .body { font: 15px Arial, sans-serif; fill: #0f172a; }
      .small { font: 13px Arial, sans-serif; fill: #475569; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="1600" height="700" fill="white"/>
  <text x="50" y="60" class="title">Installation – Schritt für Schritt</text>
  <text x="50" y="95" class="subtitle">Von der Verdrahtung bis zum fertigen Home-Assistant-Dashboard</text>

  <rect x="50" y="180" width="330" height="360" rx="22" fill="white" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="120" cy="250" r="42" fill="#dbeafe" stroke="#cbd5e1"/>
  <path d="M105 268 L135 232" stroke="#2563eb" stroke-width="5"/>
  <path d="M102 235 L138 265" stroke="#16a34a" stroke-width="5"/>
  <text x="180" y="256" class="h2">1. Verdrahten</text>
  <text x="75" y="330" class="body">ESP32-C3, RC522, Buzzer und LED laut</text>
  <text x="75" y="354" class="body">Verdrahtungsplan verbinden.</text>
  <text x="75" y="385" class="small">RC522 nur mit 3.3 V betreiben.</text>
  <circle cx="84" cy="426" r="4" fill="#2563eb"/><text x="98" y="430" class="small">RC522 an SPI anschließen</text>
  <circle cx="84" cy="454" r="4" fill="#2563eb"/><text x="98" y="458" class="small">GPIO8 für Buzzer</text>
  <circle cx="84" cy="482" r="4" fill="#2563eb"/><text x="98" y="486" class="small">GPIO2 für LED über 220 Ω</text>
  <circle cx="84" cy="510" r="4" fill="#2563eb"/><text x="98" y="514" class="small">GND gemeinsam führen</text>
  <line x1="390" y1="360" x2="420" y2="360" stroke="#0f172a" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="430" y="180" width="330" height="360" rx="22" fill="white" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="500" cy="250" r="42" fill="#dcfce7" stroke="#cbd5e1"/>
  <rect x="485" y="222" width="30" height="56" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="491" y="230" width="18" height="30" fill="#94a3b8"/>
  <text x="560" y="256" class="h2">2. ESPHome flashen</text>
  <text x="455" y="330" class="body">YAML übernehmen, Secrets eintragen und</text>
  <text x="455" y="354" class="body">auf den ESP32-C3 flashen.</text>
  <text x="455" y="385" class="small">Danach Gerät in Home Assistant einbinden.</text>
  <circle cx="464" cy="426" r="4" fill="#2563eb"/><text x="478" y="430" class="small">secrets.yaml pflegen</text>
  <circle cx="464" cy="454" r="4" fill="#2563eb"/><text x="478" y="458" class="small">USB oder OTA flashen</text>
  <circle cx="464" cy="482" r="4" fill="#2563eb"/><text x="478" y="486" class="small">HA-Aktionen erlauben</text>
  <circle cx="464" cy="510" r="4" fill="#2563eb"/><text x="478" y="514" class="small">Logs auf Fehler prüfen</text>
  <line x1="770" y1="360" x2="800" y2="360" stroke="#0f172a" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="810" y="180" width="330" height="360" rx="22" fill="white" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="880" cy="250" r="42" fill="#fae8ff" stroke="#cbd5e1"/>
  <rect x="858" y="228" width="44" height="34" rx="6" fill="#2563eb"/><rect x="864" y="236" width="32" height="18" fill="white"/>
  <text x="940" y="256" class="h2">3. HACS + Dashboard</text>
  <text x="835" y="330" class="body">Button Card installieren und die drei</text>
  <text x="835" y="354" class="body">YAML-Karten in drei Abschnitte einfügen.</text>
  <text x="835" y="385" class="small">Entity-IDs bei Bedarf anpassen.</text>
  <circle cx="844" cy="426" r="4" fill="#2563eb"/><text x="858" y="430" class="small">HACS installieren</text>
  <circle cx="844" cy="454" r="4" fill="#2563eb"/><text x="858" y="458" class="small">Button Card installieren</text>
  <circle cx="844" cy="482" r="4" fill="#2563eb"/><text x="858" y="486" class="small">3 manuelle YAML-Karten anlegen</text>
  <circle cx="844" cy="510" r="4" fill="#2563eb"/><text x="858" y="514" class="small">Frontend neu laden</text>
  <line x1="1150" y1="360" x2="1180" y2="360" stroke="#0f172a" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="1190" y="180" width="330" height="360" rx="22" fill="white" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="1260" cy="250" r="42" fill="#fef3c7" stroke="#cbd5e1"/>
  <rect x="1238" y="230" width="44" height="32" rx="5" fill="white" stroke="#94a3b8"/>
  <text x="1320" y="256" class="h2">4. RFID testen</text>
  <text x="1215" y="330" class="body">Tag scannen, Logs prüfen und unter „Tags“</text>
  <text x="1215" y="354" class="body">in Home Assistant Automationen anlegen.</text>
  <text x="1215" y="385" class="small">Optional Buzzer und LED testen.</text>
  <circle cx="1224" cy="426" r="4" fill="#2563eb"/><text x="1238" y="430" class="small">RFID UID im Log prüfen</text>
  <circle cx="1224" cy="454" r="4" fill="#2563eb"/><text x="1238" y="458" class="small">Tag-Ereignis in HA empfangen</text>
  <circle cx="1224" cy="482" r="4" fill="#2563eb"/><text x="1238" y="486" class="small">Buzzer-Töne testen</text>
  <circle cx="1224" cy="510" r="4" fill="#2563eb"/><text x="1238" y="514" class="small">Automationen unter „Tags“ anlegen</text>

  <rect x="50" y="590" width="1500" height="60" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="70" y="625" class="body">Tipp: Erst wenn der ESP online ist, die finalen Dashboard-Entitys und erweiterten Sensoren (letzter Tag, Scan-Zähler, Zugriff-Status) einbinden.</text>
</svg>